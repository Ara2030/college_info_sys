{% extends 'contingent/base.html' %}
{% block content %}
<div class="card p-4" style="max-width:560px;">
  <h4 class="mb-3">Удаление учётной записи</h4>
  <p>Удалить пользователя <b>{{ object.username }}</b>? Действие необратимо.</p>
  <form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger">Удалить</button>
      <a href="{% url 'accounts:user_list' %}" class="btn btn-outline-secondary">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
